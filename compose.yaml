name: safesite-ai

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-safesite}
      POSTGRES_USER: ${POSTGRES_USER:-safesite}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-safesite_dev_password}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./database/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-safesite} -d ${POSTGRES_DB:-safesite}"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build:
      context: ./services/api
      target: runtime
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgresql://safesite:safesite_dev_password@postgres:5432/safesite}
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 5s
      timeout: 5s
      retries: 10

  api-tests:
    profiles: ["test"]
    build:
      context: ./services/api
      target: test
    environment:
      API_BASE_URL: http://api:8000
      DATABASE_URL: ${DATABASE_URL:-postgresql://safesite:safesite_dev_password@postgres:5432/safesite}
    depends_on:
      api:
        condition: service_healthy

  ingestion:
    profiles: ["tools"]
    build:
      context: ./services/ingestion
    volumes:
      - ./data:/data

volumes:
  postgres_data:
